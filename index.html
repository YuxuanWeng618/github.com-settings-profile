<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="canonical" href="https://yuxuanweng.com/" />
    <link rel="preload" as="image" fetchpriority="high"
      imagesrcset="assets/projects/card-thumbnails/chimera-480.webp 480w, assets/projects/card-thumbnails/chimera-960.webp 960w"
      imagesizes="(max-width: 540px) calc(100vw - 2rem), (max-width: 900px) calc((100vw - 5.5rem) / 2), (max-width: 1144px) calc((100vw - 7rem) / 3), 344px" />
    <link rel="stylesheet" href="css/main.css?v=20261127-group-motion-review2" />
    <script>
      (function () {
        var t = localStorage.getItem("portfolio-theme");
        document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
        var l = localStorage.getItem("portfolio-lang");
        var lang = l === "cn" ? "cn" : "en";
        document.documentElement.setAttribute("data-lang", lang);
        document.documentElement.lang = lang === "cn" ? "zh-Hans" : "en";
      })();
    </script>
  </head>
  <body data-page="projects" class="projects-home">
